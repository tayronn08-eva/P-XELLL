name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Eski proje dosyalarini temizle ve proje.zip'i ac
        run: |
          rm -rf app settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties
          unzip -o proje.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PikselCizim-APK
          path: app/build/outputs/apk/debug/*.apk
